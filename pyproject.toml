[build-system]
requires = ["setuptools>=61.0.0", "setuptools_scm>=8.2.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "senpai-suggest"
version = "0.1.0"
# dynamic = ["version"]
description = "Anime Recommendation System using MLOps principles"
readme = "README.md"
requires-python = ">=3.12.8"
license = { text = "MIT" }
authors = [{ name = "Author", email = "thobela.sixpence@gmail.com" }]
keywords = [
    "mlops",
    "machine-learning",
    "devops",
    "recommendation-system",
    "anime",
    "python",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "awswrangler>=3.17.0",
    "boto3>=1.43.0",
    "comet-ml>=3.58.3",
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "fastapi[standard]>=0.141.1",
    "ipykernel>=7.3.0",
    "joblib>=1.5.3",
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pandera>=0.24.0",
    "pyarrow>=17.0.0",
    # "pytest-cov>=7.1.0",
    # "pytest-instafail>=0.5.0",
    # "pytest-mock>=3.15.1",
    # "pytest-randomly>=4.1.0",
    # "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "setuptools>=82.0.1",
    "torch>=2.10.0",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.13.1",
    "prefect>=3.8.4",
    "types-pyyaml>=6.0.12.20260815",
    "feast>=0.51.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "evidently>=0.7.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."

# Linux wheels of torch bundle the CUDA runtime, which adds gigabytes to a
# CPU-only container image. macOS keeps the default PyPI wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest-cov>=7.1.0",
    "pytest-instafail>=0.5.0",
    "pytest-mock>=3.15.1",
    "pytest-randomly>=4.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.0",
    "commitizen>=3.0.0",
    "pytest>=7.4.0",

]

[tool.setuptools_scm]
write_to = "_version.py"
version_scheme = "release-branch-semver"
fallback_version = "0.1.0"


# ---------------------------------------------------
# Ruff (linting + formatting)
# ---------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C90", "I"] # I = isort import sorting
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # example: allow asserts in tests

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------
# pytest
# ---------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q --cov=src --cov-report=term-missing"
markers = ["slow: marks tests as slow", "integration: marks integration tests"]

# ---------------------------------------------------
# coverage.py (used by pytest-cov)
# ---------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
fail_under = 80

# ---------------------------------------------------
# mypy (type checking)
# ---------------------------------------------------
[tool.mypy]
explicit_package_bases = true
namespace_packages = true
strict = true
ignore_missing_imports = true
disable_error_code = "misc"

# ---------------------------------------------------
# bandit (security linting)
[tool.bandit]
exclude_dirs = ["tests/", "docs", "build", "dist", "venv", ".venv"]
skips = ["B101"]
