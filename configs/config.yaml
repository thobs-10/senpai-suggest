# Project configuration template
# Environment-specific values loaded from environment variables

# Backend configuration
backend:
  host: "0.0.0.0"
  port: 8000
  reload: false # Set to true in development

# Frontend configuration
frontend:
  host: "0.0.0.0"
  port: 8501

# AWS S3 configuration
aws:
  s3_bucket: ${S3_BUCKET}
  s3_region: ${AWS_REGION}
  # Use IAM instance profiles in production instead of hardcoded credentials

# Model configuration
model:
  name: "als_recommender"
  version: "v1" # Update with git hash on deployment
  cache_dir: "/tmp/models"

# Prefect configuration
prefect:
  api_url: "http://prefect:4200/api"
  environment: "development" # Override with "production" in prod

# Logging configuration
logging:
  level: "INFO" # Set to DEBUG for development
  format: "json" # Structured JSON logging

# Monitoring configuration
monitoring:
  prometheus_enabled: true
  prometheus_port: 9090
  cloudwatch_logs: true
